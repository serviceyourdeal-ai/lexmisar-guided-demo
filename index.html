<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>LEXMISAR | Guided Demo v1.4</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#7c2755;background:#fff5f7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#ffe5ed,#fffaf6 55%,#eaf6eb);min-height:100dvh}.app{max-width:510px;margin:auto;min-height:100dvh;background:rgba(255,255,255,.94);padding:19px 18px 32px;box-shadow:0 12px 46px #bb587321}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:30px;font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,#f04088,#ffa254);color:transparent;background-clip:text}.brand{font-size:10px;letter-spacing:4px;font-weight:800}.pill{border:1px solid #f2a2c2;color:#a9396f;border-radius:50px;padding:8px 11px;font-size:10px;font-weight:800}.progress{display:flex;gap:5px;margin:15px 0 20px}.progress span{height:6px;flex:1;background:#f8dee8;border-radius:9px}.progress span.active{background:linear-gradient(90deg,#f33d91,#f57891)}.step{font-size:13px;color:#df518b;letter-spacing:.3px;font-weight:800;margin-bottom:12px}.hero{position:relative;border-radius:27px;overflow:hidden;background:radial-gradient(circle at 65% 12%,#fffaf1,transparent 42%),linear-gradient(155deg,#ffdfeb,#ffece0 53%,#edf6e9);padding:26px 19px;border:1px solid #ffe2e7;box-shadow:0 8px 22px #eeb1c12c}.picture{height:158px;display:flex;justify-content:center;gap:8px;align-items:center;filter:drop-shadow(0 8px 8px #d88f9f66)}.picture .person{font-size:95px}.picture .phone{font-size:67px;transform:rotate(10deg)}h1{font-size:clamp(22px,6vw,29px);line-height:1.3;letter-spacing:-.4px;margin:10px 0 8px;color:#9b285c}p{font-size:15px;line-height:1.75;color:#73465d;margin:8px 0 16px}.card{border:1.5px solid #f7b4cf;background:rgba(255,255,255,.94);padding:14px;border-radius:17px;margin:9px 0;font-size:15px;color:#852b58;cursor:pointer;display:block;width:100%;text-align:left;line-height:1.5}.card.selected{border:2px solid #e93d8b;background:#fff0f6;box-shadow:0 2px 12px #f49fc458}.card:focus-visible,button:focus-visible{outline:3px solid #6aa976;outline-offset:3px}.notice{border-radius:15px;background:#fff1f7;color:#985174;padding:12px;font-size:13px;line-height:1.6;margin:15px 0}.result{background:#eaf8ee;border:1px solid #b8e4c6;color:#34684b;padding:14px;border-radius:15px;line-height:1.7;font-size:14px}.warn{background:#fff1e5;color:#925c30;border:1px solid #ffd5a8}.bottom{margin-top:18px}button.primary{width:100%;border:0;border-radius:18px;padding:17px 12px;background:linear-gradient(95deg,#ef3889,#f57286);color:white;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 7px 15px #f6aec67e}button.primary:disabled{opacity:.45;cursor:not-allowed}.back{border:0;background:none;color:#a33e6f;font-size:14px;padding:15px 6px;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.row .card{width:auto;flex:1;min-width:78px;text-align:center;padding:12px 7px}.disclaimer{font-size:11px;line-height:1.5;color:#9a6c7f;text-align:center;margin-top:15px}.label{font-size:13px;color:#a74271;font-weight:700;margin-top:15px}.small{font-size:12px}.hide{display:none}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{border-radius:30px;padding:6px 10px;background:#fff;color:#a24e75;font-size:12px}a{text-decoration:none}
</style></head><body><main class="app"><header class="top"><div><div class="logo">LMS</div><div class="brand">LEXMISAR</div></div><div class="pill">SOLUTION REVEAL · DEMO</div></header><div class="progress" id="progress"></div><div id="content"></div><div class="bottom"><button id="next" class="primary">เริ่มทดลอง →</button><button id="back" class="back hide">← ย้อนกลับ</button></div><div class="disclaimer">ต้นแบบเพื่อทดลองประสบการณ์เท่านั้น · ไม่มีการจองหรือชำระเงินจริง · ไม่เก็บข้อมูลส่วนบุคคล</div></main>
<script>
let step=0,choice=-1,service=0,day=0,time=0,payment=-1;const services=[['ตัดผม','60 นาที'],['สระไดร์','45 นาที'],['ทำสีผม','120 นาที']];const times=['10:00','11:00','13:00','14:00','15:00'];const outcomes=[['หยุดทำผมแล้วรีบตอบแชต','ตอบแชตได้เร็วขึ้น แต่ต้องพักงานที่กำลังให้บริการ'],['ทำผมให้เสร็จก่อน','ดูแลลูกค้าตรงหน้าได้ต่อเนื่อง แต่ผู้ที่ติดต่อเข้ามาอาจต้องรอ'],['ให้พนักงานช่วยตอบ','แบ่งเบาภาระได้เมื่อมีคนว่าง แต่ยังต้องตรวจความถูกต้องของคิว'],['ให้ลูกค้าเลือกเวลาที่เปิดจองเอง','ลดการถามเวลาว่างซ้ำได้ แต่การยืนยันบางรายการยังต้องให้ร้านตรวจสอบ']];const el=id=>document.getElementById(id);const c=(title,desc,opts)=>'<div class="step">'+String(step+1).padStart(2,'0')+' / 06 · '+title+'</div><section class="hero"><div class="picture"><span class="person">'+(['💇🏻‍♀️','🤔','👩🏻‍💻','📱','🗓️','✨'][step])+'</span><span class="phone">'+(['📲','💬','📅','✂️','⚠️','✅'][step])+'</span></div><h1>'+desc+'</h1>'+opts+'</section>';const option=(n,t,val,selected)=>'<button class="card '+(selected===val?'selected':'')+'" onclick="'+n+'('+val+')">'+t+'</button>';
function choose(v){choice=v;render()}function pickService(v){service=v;render()}function pickDay(v){day=v;render()}function pickTime(v){time=v;render()}function pickPayment(v){payment=v;render()}
function render(){el('progress').innerHTML=Array.from({length:6},(_,i)=>'<span class="'+(i<=step?'active':'')+'"></span>').join('');el('back').classList.toggle('hide',step===0);let h='',button='';
if(step===0){h=c('เหตุการณ์จริงที่ชวนคิด','คุณกำลังทำผมให้ลูกค้าอยู่...','<p>แต่มีคนใหม่ 3 รายถามเวลาว่าง ขณะที่ลูกค้าที่จองไว้กำลังใกล้ถึงเวลานัด คุณจะจัดการอย่างไร?</p><div class="tags"><span class="tag">💬 แชตใหม่</span><span class="tag">🕑 ใกล้เวลานัด</span><span class="tag">👤 ลูกค้าตรงหน้า</span></div><div class="notice">ถ้าคุณเป็นเจ้าของร้าน จะเลือกทางไหน?</div>');button='ลองเลือกวิธีรับมือ →'}
if(step===1){h=c('เลือกวิธีรับมือ','ถ้าเป็นคุณ จะทำอย่างไร?','<p>ทุกวิธีมีทั้งข้อดีและข้อจำกัด เลือกวิธีที่คุณใช้จริงได้เลย</p>'+outcomes.map((o,i)=>option('choose',(i+1)+'. '+o[0],i,choice)).join(''));button='ดูผลลัพธ์ของทางเลือก →'}
if(step===2){h=c('Solution Reveal','LMS จะช่วยลดงานตรงไหน?','<div class="result"><b>วิธีที่คุณเลือก:</b> '+(choice<0?'ยังไม่ได้เลือก':outcomes[choice][0])+'<p class="small">'+(choice<0?'':outcomes[choice][1])+'</p></div><p>ถ้าร้านเปิดช่วงเวลาที่รับจองในระบบไว้ ลูกค้าสามารถดูบริการและส่งคำขอจองเองได้ โดยเจ้าของร้านเห็นรายการและสถานะที่ต้องตรวจสอบ</p><div class="card">🗓️ ลูกค้าดูช่วงเวลาที่เปิดให้จองได้</div><div class="card">📩 ส่งคำขอจองโดยไม่ต้องถามซ้ำทีละข้อความ</div><div class="card">✅ ร้านยังเป็นผู้ยืนยันเรื่องสำคัญ</div>');button='ลองจองคิวในมุมลูกค้า →'}
if(step===3){h=c('ทดลองจองคิว','ลองเป็นลูกค้าที่เข้ามาจองเอง','<div class="label">เลือกบริการ</div><div class="row">'+services.map((s,i)=>option('pickService',s[0]+'<br><span class="small">'+s[1]+'</span>',i,service)).join('')+'</div><div class="label">เลือกวันจำลอง</div><div class="row">'+['วัน A','วัน B','วัน C'].map((s,i)=>option('pickDay',s,i,day)).join('')+'</div><div class="label">เลือกเวลาจำลอง</div><div class="row">'+times.map((s,i)=>option('pickTime',s,i,time)).join('')+'</div><div class="result">คำขอจองจำลอง: '+services[service][0]+' · '+['วัน A','วัน B','วัน C'][day]+' '+times[time]+'<br>สถานะ: รอร้านยืนยัน</div>');button='ส่งคำขอจอง (จำลอง) →'}
if(step===4){h=c('จัดการคิวชน','ถ้ามีสองคนต้องการเวลาเดียวกัน?','<p>ลูกค้า A จองก่อน แต่ยังไม่ชำระมัดจำ ลูกค้า B แจ้งว่าชำระแล้ว เจ้าของร้านต้องตรวจสอบยอดเงินจริงก่อนดำเนินการ</p><div class="card">🕑 14:00 · คุณพลอย — จองก่อน / ยังไม่จ่ายมัดจำ</div><div class="card">🕑 14:00 · คุณมิ้นท์ — แจ้งชำระ / รอร้านตรวจ</div><div class="label">ผลการตรวจสอบยอดเงินจำลอง</div>'+option('pickPayment','ตรวจแล้ว: ได้รับเงินจากคุณมิ้นท์',0,payment)+option('pickPayment','ตรวจแล้ว: ไม่พบยอดเงินจากคุณมิ้นท์',1,payment)+(payment!==-1?'<div class="result '+(payment===1?'warn':'')+'">'+(payment===0?'ยืนยันคิวคุณมิ้นท์ตามเงื่อนไข และเสนอเวลาใหม่ให้คุณพลอยโดยรอการตอบรับ':'ตรวจสิทธิ์และกรอบเวลาที่เกี่ยวข้อง ก่อนปลดล็อกคิวชั่วคราวและจัดการตามลำดับเดิม')+'</div>':'<div class="notice">ต้องเลือกผลตรวจสอบก่อนจึงดำเนินการต่อได้</div>')+'<p class="small">หมายเหตุ: ล็อกรอมัดจำ 30 นาทีและช่วงผ่อนผันหลังเวลานัด 15 นาทีเป็นกติกาคนละส่วน</p>');button='ดูผลลัพธ์ที่ LMS ช่วยสรุป →'}
if(step===5){h=c('ผลลัพธ์และสรุป','คุณเห็นภาพการจัดการคิวแล้ว','<div class="result">✅ ลูกค้าส่งคำขอจองได้เอง<br>✅ ร้านเห็นสถานะคิวและสิ่งที่ต้องตรวจ<br>✅ เห็นขั้นตอนตัดสินใจเมื่อคิวชน</div><div class="notice">เจ้าของร้านยังต้องตรวจยอดเงินจริง ยืนยันคิวสำคัญ และตัดสินใจเรื่องหน้างานด้วยตนเอง</div><p>อยากรู้ว่ารูปแบบนี้เหมาะกับร้านของคุณไหม? ติดต่อทีมงานผ่านแชต LEXMISAR ได้เลย</p>');button='ทดลองอีกครั้ง ↻'}
el('content').innerHTML=h;el('next').textContent=button;el('next').disabled=(step===1&&choice===-1)||(step===4&&payment===-1)}
el('next').onclick=()=>{if(step===5){step=0;choice=-1;payment=-1;service=0;day=0;time=0}else step++;render();window.scrollTo(0,0)};el('back').onclick=()=>{if(step>0)step--;render();window.scrollTo(0,0)};render();
</script></body></html>
