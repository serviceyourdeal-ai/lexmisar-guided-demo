<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#7c2755;background:#fff5f7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#ffe5ed,#fffaf6 55%,#eaf6eb);min-height:100dvh}.app{max-width:510px;margin:auto;min-height:100dvh;background:rgba(255,255,255,.94);padding:19px 18px 32px;box-shadow:0 12px 46px #bb587321}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:30px;font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,#f04088,#ffa254);color:transparent;background-clip:text}.brand{font-size:10px;letter-spacing:4px;font-weight:800}.pill{border:1px solid #f2a2c2;color:#a9396f;border-radius:50px;padding:8px 11px;font-size:10px;font-weight:800}.progress{display:flex;gap:5px;margin:15px 0 20px}.progress span{height:6px;flex:1;background:#f8dee8;border-radius:9px}.progress span.active{background:linear-gradient(90deg,#f33d91,#f57891)}.step{font-size:13px;color:#df518b;letter-spacing:.3px;font-weight:800;margin-bottom:12px}.hero{position:relative;border-radius:27px;overflow:hidden;background:radial-gradient(circle at 65% 12%,#fffaf1,transparent 42%),linear-gradient(155deg,#ffdfeb,#ffece0 53%,#edf6e9);padding:26px 19px;border:1px solid #ffe2e7;box-shadow:0 8px 22px #eeb1c12c}.picture{height:158px;display:flex;justify-content:center;gap:8px;align-items:center;filter:drop-shadow(0 8px 8px #d88f9f66)}.picture .person{font-size:95px}.picture .phone{font-size:67px;transform:rotate(10deg)}h1{font-size:clamp(22px,6vw,29px);line-height:1.3;letter-spacing:-.4px;margin:10px 0 8px;color:#9b285c}p{font-size:15px;line-height:1.75;color:#73465d;margin:8px 0 16px}.card{border:1.5px solid #f7b4cf;background:rgba(255,255,255,.94);padding:14px;border-radius:17px;margin:9px 0;font-size:15px;color:#852b58;cursor:pointer;display:block;width:100%;text-align:left;line-height:1.5}.card.selected{border:2px solid #e93d8b;background:#fff0f6;box-shadow:0 2px 12px #f49fc458}.card:focus-visible,butto <script>
let step=0,choice=-1,service=0,day=0,time=0,payment=-1;const services=[['ตัดผม','60 นาที'],['สระไดร์','45 นาที'],['ทำสีผม','120 นาที']];const times=['10:00','11:00','13:00','14:00','15:00'];const outcomes=[['หยุดทำผมแล้วรีบตอบแชต','ตอบแชตได้เร็วขึ้น แต่ต้องพักงานที่กำลังให้บริการ'],['ทำผมให้เสร็จก่อน','ดูแลลูกค้าตรงหน้าได้ต่อเนื่อง แต่ผู้ที่ติดต่อเข้ามาอาจต้องรอ'],['ให้พนักงานช่วยตอบ','แบ่งเบาภาระได้เมื่อมีคนว่าง แต่ยังต้องตรวจความถูกต้องของคิว'],['ให้ลูกค้าเลือกเวลาที่เปิดจองเอง','ลดการถามเวลาว่างซ้ำได้ แต่การยืนยันบางรายการยังต้องให้ร้านตรวจสอบ']];const el=id=>document.getElementById(id);const c=(title,desc,opts)=>'<div class="step">'+String(step+1).padStart(2,'0')+' / 06 · '+title+'</div><section class="hero"><div class="picture"><svg viewBox="0 0 480 240" role="img" aria-label="ภาพประกอบร้านเสริมสวยและระบบจองคิว" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff6e9"/><stop offset=".6" stop-color="#ffd8e5"/><stop offset="1" stop-color="#ffeccf"/></linearGradient><linearGradient id="hair" x2="1"><stop stop-color="#693c39"/><stop offset=".6" stop-color="#b16a56"/><stop offset="1" stop-color="#69413b"/></linearGradient><linearGradient id="screen" x2="1" y2="1"><stop stop-color="#fdaec8"/><stop offset="1" stop-color="#ffe5f0"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="12"/></filter></defs><rect width="480" height="240" rx="28" fill="url(#bg)"/><g opacity=".5"><circle cx="45" cy="40" r="40" fill="#fff" filter="url(#gl)"/><circle cx="440" cy="175" r="50" fill="#f4a4ca" filter="url(#gl)"/><path d="M20 160 Q80 80 130 180M370 40 Q420 10 470 70" stroke="#fff" stroke-width="10" fill="none"/></g><rect x="22" y="20" width="87" height="130" rx="18" fill="#f4b9a6" opacity=".5"/><rect x="35" y="28" width="61" height="108" rx="30" fill="#fff6df"/><circle cx="65" cy="83" r="26" fill="#ffdfb7"/><rect x="32" y="158" width="110" height="17" rx="8" fill="#ffffff" opacity=".8"/><path d="M45 224 Q24 141 101 125 Q152 146 143 224" fill="url(#hair)"/><ellipse cx="95" cy="133" rx="40" ry="54" fill="url(#hair)"/><ellipse cx="101" cy="145" rx="27" ry="34" fill="#f5bd9d"/><path d="M64 133 Q61 82 100 77 Q146 73 137 135 Q114 96 67 140" fill="url(#hair)"/><path d="M57 228 Q65 180 99 184 Q138 182 151 232" fill="#e891b3"/><path d="M149 237 Q146 187 185 175 Q226 159 244 237" fill="#292333"/><path d="M161 187 Q155 169 171 154 L206 152 Q221 166 208 187" fill="#fff5ea"/><path d="M153 169 Q147 119 158 102 Q156 63 194 59 Q222 62 220 104 Q240 145 214 180" fill="url(#hair)"/><ellipse cx="189" cy="111" rx="35" ry="43" fill="#f5b599"/><path d="M153 111 Q145 62 189 61 Q226 65 219 115 Q200 80 159 116" fill="url(#hair)"/><circle cx="191" cy="52" r="22" fill="#895048"/><path d="M173 109 q8 -6 15 0m13 0q7-6 14 0" stroke="#6d3a45" stroke-width="2.5" fill="none"/><path d="M188 127 q12 10 22 0" stroke="#bf6679" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="181" cy="117" r="4" fill="#f6a0a1" opacity=".65"/><circle cx="218" cy="117" r="4" fill="#f6a0a1" opacity=".65"/><path d="M235 180L272 107" stroke="#d684a4" stroke-width="9" stroke-linecap="round"/><path d="M267 101L284 112" stroke="#a35b75" stroke-width="12" stroke-linecap="round"/><g transform="rotate(8 347 133)"><rect x="286" y="40" width="136" height="182" rx="20" fill="#aa617f"/><rect x="293" y="47" width="122" height="167" rx="13" fill="#fffafc"/><rect x="303" y="59" width="102" height="30" rx="9" fill="#ffcee2"/><text x="354" y="79" text-anchor="middle" fill="#b54e7d" font-size="13" font-weight="bold">LMS</text><g fill="#ffdfed"><rect x="305" y="99" width="30" height="27" rx="7"/><rect x="341" y="99" width="30" height="27" rx="7"/><rect x="377" y="99" width="27" height="27" rx="7"/><rect x="305" y="133" width="30" height="27" rx="7"/><rect x="341" y="133" width="30" height="27" rx="7"/><rect x="377" y="133" width="27" height="27" rx="7"/><rect x="305" y="168" width="99" height="30" rx="9" fill="#f46c9d"/></g><g fill="#cc5e89"><circle cx="320" cy="113" r="4"/><circle cx="355" cy="113" r="4"/><circle cx="390" cy="113" r="4"/></g><path d="M343 183l8 7 14-16" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/></g><g fill="#fff8d8" opacity=".9"><path d="M256 28l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M445 63l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><circle cx="42" cy="197" r="4"/></g></svg></div><h1>'+desc+'</h1>'+opts+'</section>';const option=(n,t,val,selected)=>'<button class="card '+(selected===val?'selected':'')+'" onclick="'+n+'('+val+')">'+t+'</button>';
function choose(v){choice=v;render()}function pickService(v){service=v;render()}function pickDay(v){day=v;render()}function pickTime(v){time=v;render()}function pickPayment(v){payment=v;render()}
function render(){el('progress').innerHTML=Array.from({length:6},(_,i)=>'<span class="'+(i<=step?'active':'')+'"></span>').join('');el('back').classList.toggle('hide',step===0);let h='',button='';
if(step===0){h=c('เหตุการณ์จริงที่ชวนคิด','คุณกำลังทำผมให้ลูกค้าอยู่...','<p>แต่มีคนใหม่ 3 รายถามเวลาว่าง ขณะที่ลูกค้าที่จองไว้กำลังใกล้ถึงเวลานัด คุณจะจัดการอย่างไร?</p><div class="tags"><span class="tag">💬 แชตใหม่</span><span class="tag">🕑 ใกล้เวลานัด</span><span class="tag">👤 ลูกค้าตรงหน้า</span></div><div class="notice">ถ้าคุณเป็นเจ้าของร้าน จะเลือกทางไหน?</div>');button='ลองเลือกวิธีรับมือ →'}
if(step===1){h=c('เลือกวิธีรับมือ','ถ้าเป็นคุณ จะทำอย่างไร?','<p>ทุกวิธีมีทั้งข้อดีและข้อจำกัด เลือกวิธีที่คุณใช้จริงได้เลย</p>'+outcomes.map((o,i)=>option('choose',(i+1)+'. '+o[0],i,choice)).join(''));button='ดูผลลัพธ์ของทางเลือก →'}
if(step===2){h=c('Solution Reveal','LMS จะช่วยลดงานตรงไหน?','<div class="result"><b>วิธีที่คุณเลือก:</b> '+(choice<0?'ยังไม่ได้เลือก':outcomes[choice][0])+'<p class="small">'+(choice<0?'':outcomes[choice][1])+'</p></div><p>ถ้าร้านเปิดช่วงเวลาที่รับจองในระบบไว้ ลูกค้าสามารถดูบริการและส่งคำขอจองเองได้ โดยเจ้าของร้านเห็นรายการและสถานะที่ต้องตรวจสอบ</p><div class="card">🗓️ ลูกค้าดูช่วงเวลาที่เปิดให้จองได้</div><div class="card">📩 ส่งคำขอจองโดยไม่ต้องถามซ้ำทีละข้อความ</div><div class="card">✅ ร้านยังเป็นผู้ยืนยันเรื่องสำคัญ</div>');button='ลองจองคิวในมุมลูกค้า →'}
if(step===3){h=c('ทดลองจองคิว','ลองเป็นลูกค้าที่เข้ามาจองเอง','<div class="label">เลือกบริการ</div><div class="row">'+services.map((s,i)=>option('pickService',s[0]+'<br><span class="small">'+s[1]+'</span>',i,service)).join('')+'</div><div class="label">เลือกวันจำลอง</div><div class="row">'+['วัน A','วัน B','วัน C'].map((s,i)=>option('pickDay',s,i,day)).join('')+'</div><div class="label">เลือกเวลาจำลอง</div><div class="row">'+times.map((s,i)=>option('pickTime',s,i,time)).join('')+'</div><div class="result">คำขอจองจำลอง: '+services[service][0]+' · '+['วัน A','วัน B','วัน C'][day]+' '+times[time]+'<br>สถานะ: รอร้านยืนยัน</div>');button='ส่งคำขอจอง (จำลอง) →'}
if(step===4){h=c('จัดการคิวชน','ถ้ามีสองคนต้องการเวลาเดียวกัน?','<p>ลูกค้า A จองก่อน แต่ยังไม่ชำระมัดจำ ลูกค้า B แจ้งว่าชำระแล้ว เจ้าของร้านต้องตรวจสอบยอดเงินจริงก่อนดำเนินการ</p><div class="card">🕑 14:00 · คุณพลอย — จองก่อน / ยังไม่จ่ายมัดจำ</div><div class="card">🕑 14:00 · คุณมิ้นท์ — แจ้งชำระ / รอร้านตรวจ</div><div class="label">ผลการตรวจสอบยอดเงินจำลอง</div>'+option('pickPayment','ตรวจแล้ว: ได้รับเงินจากคุณมิ้นท์',0,payment)+option('pickPayment','ตรวจแล้ว: ไม่พบยอดเงินจากคุณมิ้นท์',1,payment)+(payment!==-1?'<div class="result '+(payment===1?'warn':'')+'">'+(payment===0?'ยืนยันคิวคุณมิ้นท์ตามเงื่อนไข และเสนอเวลาใหม่ให้คุณพลอยโดยรอการตอบรับ':'ตรวจสิทธิ์และกรอบเวลาที่เกี่ยวข้อง ก่อนปลดล็อกคิวชั่วคราวและจัดการตามลำดับเดิม')+'</div>':'<div class="notice">ต้องเลือกผลตรวจสอบก่อนจึงดำเนินการต่อได้</div>')+'<p class="small">หมายเหตุ: ล็อกรอมัดจำ 30 นาทีและช่วงผ่อนผันหลังเวลานัด 15 นาทีเป็นกติกาคนละส่วน</p>');button='ดูผลลัพธ์ที่ LMS ช่วยสรุป →'}
if(step===5){h=c('ผลลัพธ์และสรุป','คุณเห็นภาพการจัดการคิวแล้ว','<div class="result">✅ ลูกค้าส่งคำขอจองได้เอง<br>✅ ร้านเห็นสถานะคิวและสิ่งที่ต้องตรวจ<br>✅ เห็นขั้นตอนตัดสินใจเมื่อคิวชน</div><div class="notice">เจ้าของร้านยังต้องตรวจยอดเงินจริง ยืนยันคิวสำคัญ และตัดสินใจเรื่องหน้างานด้วยตนเอง</div><p>อยากรู้ว่ารูปแบบนี้เหมาะกับร้านของคุณไหม? ติดต่อทีมงานผ่านแชต LEXMISAR ได้เลย</p>');button='ทดลองอีกครั้ง ↻'}
el('content').innerHTML=h;el('next').textContent=button;el('next').disabled=(step===1&&choice===-1)||(step===4&&payment===-1)}
el('next').onclick=()=>{if(step===5){step=0;choice=-1;payment=-1;service=0;day=0;time=0}else step++;render();window.scrollTo(0,0)};el('back').onclick=()=>{if(step>0)step--;render();window.scrollTo(0,0)};render();
</script></body></html>
