พักงานที่กำลังทำอยู่','งานไม่สะดุด แต่คนติดต่อใหม่อาจต้องรอ','ช่วยแบ่งเบาได้ แต่ยังต้องประสานสถานะคิว','ลูกค้าส่งคำขอเองได้ แต่ร้านยังต้องยืนยันรายการสำคัญ'];const titles=['เหตุการณ์จริงที่ชวนคิด','เลือกวิธีรับมือ','LMS จะช่วยอย่างไร','ทดลองจองคิว','จัดการคิวชน','ผลลัพธ์และสรุป'];const byId=id=>document.getElementById(id);const btn=(t,fn,v,selected)=>`<button class="choice ${v===selected?'selected':''}" onclick="${fn}(${v})" aria-pressed="${v===selected}">${v===selected?'◉':'○'} ${t}</button>`;function choose(v){choice=v;render()}function svc(v){service=v;render()}function date(v){day=v;render()}function hour(v){slot=v;render()}function paid(v){payment=v;render()}
function render(){byId('progress').innerHTML=Array.from({length:6},(_,i)=>`<span class="bar ${i<=step?'on':''}"></span>`).join('');let out=`<div class="step">${String(step+1).padStart(2,'0')} / 06 · ${titles[step]}</div><div class="hero"><img src="${HERO[step]}" alt="ภาพประกอบ LEXMISAR หน้าที่ ${step+1} ตาม Master Design" /></div><div class="panel">`,label='ไปต่อ →';if(step===0){out+=`<h1>คุณกำลังทำผมให้ลูกค้าอยู่...</h1><p>แต่มีลูกค้าใหม่ทักเข้ามาพร้อมกันสามราย และมีคนใกล้ถึงเวลานัด หากเป็นคุณ จะจัดการเรื่องไหนก่อน?</p><div class="note">ลองสวมบทเจ้าของร้านในสถานการณ์จำลอง 6 ขั้นตอน</div>`;label='ลองเลือกวิธีรับมือ →'}else if(step===1){out+=`<h1>ถ้าเป็นคุณ จะทำอย่างไร?</h1><p>เลือกทางออกที่ใกล้เคียงกับวิธีที่คุณใช้จริง ทุกตัวเลือกมีทั้งข้อดีและข้อจำกัด</p><div class="choices">${ways.map((t,i)=>btn(t,'choose',i,choice)).join('')}</div>`;label='ดูผลของทางเลือก →'}else if(step===2){out+=`<h1>LMS ช่วยลดงานตรงไหน?</h1><div class="result">ทางที่คุณเลือก: ${ways[choice]}<div class="small">${consequences[choice]}</div></div><p>หากร้านกำหนดช่วงเวลาที่เปิดจองไว้ ลูกค้าสามารถเลือกบริการ ตรวจช่วงเวลา และส่งคำขอจองได้เอง</p><div class="note">✓ ช่วยลดแชตถามเวลาว่างซ้ำ<br>✓ รวบรวมคำขอจองและแสดงสถานะ<br>✓ เรื่องสำคัญยังต้องให้เจ้าของร้านตรวจสอบ</div>`;label='ลองจองคิวในมุมลูกค้า →'}else if(step===3){out+=`<h1>ทดลองจองคิวด้วยตัวเอง</h1><div class="group">เลือกบริการ (ตัวอย่าง)</div><div class="choices">${services.map((t,i)=>btn(t,'svc',i,service)).join('')}</div><div class="group">เลือกวัน</div><div class="three">${days.map((t,i)=>btn(t,'date',i,day)).join('')}</div><div class="group">เลือกเวลา</div><div class="three">${times.map((t,i)=>btn(t,'hour',i,slot)).join('')}</div><div class="result">คำขอจองจำลอง: ${services[service]} · ${days[day]} ${times[slot]}<br>สถานะ: รอร้านยืนยัน</div>`;label='ส่งคำขอจองจำลอง →'}else if(step===4){out+=`<h1>สองคนต้องการเวลาเดียวกัน</h1><p>คุณพลอยจองก่อนแต่ยังไม่จ่ายมัดจำ คุณมิ้นท์แจ้งชำระแล้ว แต่ร้านยังต้องตรวจสอบยอดจริง</p><div class="note">14:00 — คุณพลอย: รอมัดจำ<br>14:00 — คุณมิ้นท์: แจ้งชำระ / รอตรวจ</div><div class="group">ผลการตรวจยอดเงินโดยเจ้าของร้าน (จำลอง)</div><div class="choices">${btn('ยืนยันว่าได้รับเงินคุณมิ้นท์แล้ว','paid',0,payment)}${btn('ตรวจแล้วไม่พบยอดเงิน','paid',1,payment)}</div>${payment===-1?'<div class="note">เลือกผลการตรวจสอบเพื่อดูผลจำลอง</div>':`<div class="result ${payment===1?'warning':''}">${payment===0?'ระบบจำลองแสดงการยืนยันคิวคุณมิ้นท์ และเสนอเวลาใหม่ให้คุณพลอย โดยไม่เปลี่ยนคิวฝ่ายหลังอัตโนมัติ':'ต้องตรวจกรอบเวลาล็อกและสิทธิ์เดิมให้ครบ ก่อนปลดล็อกคิวชั่วคราวและดำเนินการตามลำดับจอง'}</div>`}<p class="small">ช่วงล็อกคิวรอมัดจำ 30 นาที และผ่อนผันหลังเวลานัด 15 นาทีเป็นคนละเงื่อนไข</p>`;label='ดูผลลัพธ์ที่ LMS ช่วยสรุป →'}else{out+=`<h1>นี่คือสิ่งที่ LMS ช่วยให้เห็น</h1><div class="result">✓ ลูกค้าส่งคำขอจองได้เอง<br>✓ ร้านเห็นสถานะคิวและรายการที่ต้องตรวจ<br>✓ มีแนวทางตัดสินใจในสถานการณ์คิวชน</div><div class="note">สิ่งที่ร้านยังต้องทำ: ตรวจยอดเงินจริง ยืนยันคิวสำคัญ และตัดสินใจหน้างานด้วยตนเอง</div><p>หากต้องการคำแนะนำว่ารูปแบบนี้เหมาะกับร้านคุณหรือไม่ สามารถกลับไปแชต LINE OA ของ LEXMISAR ได้</p>`;label='ทดลองอีกครั้ง ↻'}out+='</div>';byId('content').innerHTML=out;byId('next').textContent=label;byId('next').disabled=(step===1&&choice===-1)||(step===4&&payment===-1);byId('back').hidden=(step===0)}byId('next').addEventListener('click',()=>{if(step===5){step=0;choice=-1;payment=-1;service=0;day=0;slot=3}else step++;render();scrollTo(0,0)});byId('back').addEventListener('click',()=>{step=Math.max(0,step-1);render();scrollTo(0,0)});render();
</script></body></html>
