name: LEXMISAR Controlled LINE Test - Preparation ONLY
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch (read-only, no credentials persisted)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test preparation and rollback plan (offline)
        run: python3 scripts/controlled_line_preflight.py
